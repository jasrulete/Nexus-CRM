name: Reset demo data

# The landing page invites anyone to try the live demo, so visitors accumulate
# records and edits. DEMO_MODE blocks deletion but not creation; this rebuilds
# the workspace nightly.
#
# Deliberately a scheduled workflow rather than a Vercel cron hitting a
# protected route: that would mean publishing a URL whose job is to erase the
# database. Here there is no endpoint at all — see
# docs/superpowers/specs/2026-08-01-demo-reset-design.md.

on:
  schedule:
    # 19:00 UTC = 03:00 in Manila. GitHub may delay scheduled runs under load;
    # for a nightly tidy-up that is fine.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-demo
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Not a secret — a dummy path so `prisma generate` has a URL to read.
      # The reset targets Turso, so this file is never created.
      DATABASE_URL: "file:./unused.db"
    steps:
      # Pinned to commit SHAs: this is the only workflow holding production
      # credentials, and it runs unattended on a nightly cron.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts, then generate explicitly: the Turso write token is
      # scoped to the reset step below, but a job-level env block would have
      # put it in scope for every lifecycle script in the dependency tree.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Fail fast if the database secrets are missing
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "${TURSO_DATABASE_URL}" ]; then
            echo "TURSO_DATABASE_URL secret is not set — nothing to reset."
            exit 1
          fi
          # A rotated or renamed token would otherwise fail later, inside the
          # reset script, instead of here.
          if [ -z "${TURSO_AUTH_TOKEN}" ]; then
            echo "TURSO_AUTH_TOKEN secret is not set — cannot reach the database."
            exit 1
          fi

      - name: Reset the demo workspace
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Confirms the destructive run is intentional; the script refuses a
          # remote target without it.
          ALLOW_REMOTE_DB: "true"
        run: npm run demo:reset
