name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy SQLite path — no page queries the DB at build time, but the
      # Prisma config and driver adapter expect a URL to be present.
      DATABASE_URL: "file:./ci.db"
      # Required at runtime in production (spec §6): the standalone server the
      # e2e suite starts runs with NODE_ENV=production. Read at runtime, never
      # inlined, so one build serves both e2e servers; the multi-mode server
      # overrides it in playwright.config.ts.
      WORKSPACE_MODE: "single"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`
      - name: Install dependencies
        run: npm ci

      # Two steps on purpose, because "fail the build on any advisory" is not
      # honest here. Three high advisories are open right now — prisma,
      # @prisma/config and deepmerge-ts — and npm's only offered fix is a
      # downgrade to Prisma 6, which is rejected. (--omit=dev does *not* drop
      # them: npm keeps `prisma` in the audited graph even though package.json
      # lists it as a devDependency. Verified, not assumed.)
      #
      # So: a critical advisory blocks, because that should stop a release and
      # nothing is critical today. Anything lower is printed for a human without
      # holding the build hostage to a fix that does not exist. Dependabot is
      # what actually chases these now; this step is just the view from CI.
      - name: Audit dependencies (blocking on critical)
        run: npm audit --audit-level=critical

      - name: Audit dependencies (report high and below)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The committed migrations must build exactly prisma/schema.prisma. M1
      # carries hand-appended data statements, and a hand edit that also changed
      # the schema would otherwise ship unnoticed: the Turso and Docker runners
      # and the test harness all trust the SQL files, never the schema. Replays
      # prisma/migrations into a throwaway SQLite shadow and diffs it against
      # the schema; exit code 2 means drift. (Prisma 7 removed
      # --shadow-database-url and --to-url; SQLite needs no shadow URL.)
      - name: Migration drift check
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      # Runs the same suite, and fails if coverage drops below the floor in
      # vitest.config.ts — so deleting a test file, or adding a module with
      # none, is caught here rather than noticed months later.
      - name: Unit tests with coverage
        run: npm run test:coverage

      # The AI evaluation harness (src/eval): fixture contacts through the real
      # actions with the provider keys blank, so it exercises the heuristic
      # path, the prompt fence and the parsing at zero cost. The nightly
      # eval-live.yml runs the same file against the real providers.
      - name: Evaluation harness (no API key)
        env:
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
        run: npm run eval

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # e2e signs in as the seeded demo user, so CI needs a real database. The
      # multi-mode project gets its own, migrated and deliberately not seeded:
      # every sign-up there must start in an empty workspace of its own.
      - name: Prepare e2e databases
        run: |
          npx prisma migrate deploy
          npm run db:seed
          DATABASE_URL="file:./e2e-multi.db" npx prisma migrate deploy

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
