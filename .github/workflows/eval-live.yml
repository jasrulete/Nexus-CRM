name: AI evaluation (live providers)

# The same harness that runs keyless in CI on every PR (src/eval), pointed at
# the real providers once a night. Informational by design: it never gates a
# merge, because a provider having a bad day is information, not a regression.
#
# Red here means the MODEL misbehaved. A provider that errored, timed out or
# rate-limited us is retried once and then reported as a skip, so this job
# stays green through the weather -- see src/eval/outcome.ts. The one
# exception is a run in which nothing was answered at all: that proves
# nothing, and says so in red.
#
# One leg per provider, each with only its own key in scope, so the verdict is
# about that provider alone: the chain never falls through to the other. With
# both keys set that is two runs of twelve calls; Gemini's free allowance is
# twenty a day per project per model, Groq's is a thousand. Google enforces
# its limits per PROJECT, not per key, so the Gemini leg spares the production
# quota only if EVAL_GEMINI_API_KEY was minted in its own Google Cloud project.
# A leg whose secret is absent says so and skips; it never fails the run.

on:
  schedule:
    # 08:30 UTC (16:30 in Manila): after Google's free-tier daily quota has
    # reset at midnight Pacific in BOTH halves of the year - 07:00 UTC under
    # daylight time, 08:00 UTC under standard time. The first scheduled run,
    # at 20:00 UTC, got five of eighteen calls answered; the 429 bodies named
    # the quota: GenerateRequestsPerDayPerProjectPerModel-FreeTier, value 20.
    # In practice GitHub starts this between 12:19 and 14:23 UTC (observed on
    # every run 09-07 to 09-12): a 4-6 hour queue delay, still inside a fresh
    # quota day and after the Manila working day, so it is left alone.
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-live
  cancel-in-progress: false

jobs:
  eval:
    name: eval (${{ matrix.provider }})
    runs-on: ubuntu-latest
    # Room for the harness's worst night: every call timing out and the whole
    # retry budget spent still fits inside the 25-minute hook budget in
    # vitest.eval.config.ts, and this leaves margin around it.
    timeout-minutes: 30
    strategy:
      # One provider's bad night must not cancel the other's verdict.
      fail-fast: false
      matrix:
        include:
          - provider: gemini
            secret: EVAL_GEMINI_API_KEY
          - provider: groq
            secret: EVAL_GROQ_API_KEY
    env:
      # Not a secret — a dummy path so `prisma generate` has a URL to read.
      # The harness builds its own throwaway SQLite database.
      DATABASE_URL: "file:./unused.db"
    steps:
      # Pinned to commit SHAs, like every workflow here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # A plain install, as in ci.yml: postinstall runs `prisma generate`, and
      # better-sqlite3's install script fetches the native binding the harness
      # needs to open its throwaway database (reset-demo.yml can skip scripts
      # because it only ever talks to Turso). The provider keys are scoped to
      # the eval step below, so nothing at install time can see them either way.
      - name: Install dependencies
        run: npm ci

      - name: Check for the ${{ matrix.provider }} evaluation key
        id: keys
        env:
          EVAL_KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "${EVAL_KEY}" ]; then
            echo "::notice::No ${{ matrix.secret }} secret is set; skipping the ${{ matrix.provider }} leg."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the harness against ${{ matrix.provider }} only
        if: steps.keys.outputs.present == 'true'
        env:
          EVAL_LIVE: "1"
          # Twenty requests per day per model on Gemini's free tier. Three
          # adversarial fixtures plus one ordinary is 12 calls; with the whole
          # retry budget spent that is 18, inside the day's twenty. The harness
          # default of three ordinary fixtures is 18 calls before any retry,
          # which is why every retry on the first run was itself a 429.
          EVAL_LIVE_ORDINARY: "1"
          # Exactly one key per leg. The other stays empty on purpose: the
          # provider chain tries every configured key in order, so a second
          # key here would let Gemini's weather be answered by Groq and the
          # report would say nothing about either.
          GEMINI_API_KEY: ${{ matrix.provider == 'gemini' && secrets.EVAL_GEMINI_API_KEY || '' }}
          GROQ_API_KEY: ${{ matrix.provider == 'groq' && secrets.EVAL_GROQ_API_KEY || '' }}
        run: npm run eval -- --reporter=default --reporter=json --outputFile=eval-report-${{ matrix.provider }}.json

      - name: Upload the report
        if: always() && steps.keys.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-report-${{ matrix.provider }}
          path: eval-report-${{ matrix.provider }}.json
          retention-days: 30
